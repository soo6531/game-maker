11. 개발은 6단계로 쪼개겠습니다

여기가 바이브 코딩 과제에서 중요합니다. Cursor에 “이 게임 전부 만들어줘”라고 한 번에 시키지 않는 것을 권합니다.

1단계 — 게임 화면
사이버 배경 + 3개 레인 + 캐릭터 하나를 화면에 표시

2단계 — 캐릭터 조작
← → 이동 + Space 점프

3단계 — 장애물
바이러스가 앞에서 다가오고 충돌 판정

4단계 — 체력
❤️ 5개 → 충돌하면 -1 → 0이면 Game Over

5단계 — 백신과 점수
백신 획득 → ❤️ +1(최대 5) + 점수 시스템

6단계 — 캐릭터 선택
첨부하신 노란 새 / 흰 곰 중 선택 → 선택한 캐릭터로 게임 시작

이 순서로 만들면 중간에 문제가 생겨도 어느 단계에서 오류가 났는지 바로 알 수 있습니다.

그리고 이 게임에는 숨은 장점이 하나 있습니다

단순 과제로 끝내지 않고 나중에 재연님이 만드는 배터리 플랫폼을 배우는 데 필요한 개념들이 거의 다 들어갑니다.

캐릭터 선택 → 사용자 선택값 저장

점수 → 변수

바이러스 충돌 → 조건문

백신 → 이벤트

목숨 최대 5 → 데이터 상태관리

최고점수 → localStorage

그래서 게임을 하나 완성하면 웹 개발 기본기가 상당히 자연스럽게 연습됩니다.