🎮 바이브 코딩 게임 기획안
프로젝트명: AI Cyber Run — 백신을 찾아서

장르: 3레인 러닝 + 회피 + 아이템 수집 게임
플랫폼: PC 웹 브라우저
조작: 키보드 방향키 중심
개발 방향: HTML + CSS + JavaScript 기반의 바이브 코딩
핵심 콘셉트: 사이버 세계를 달리며 바이러스를 피하고 백신을 획득해 최대한 높은 점수를 기록한다.

6
1. 게임의 이야기

AI 세계에 정체불명의 컴퓨터 바이러스가 퍼졌습니다.

플레이어는 첨부하신 노란 새 AI 캐릭터 또는 흰색 곰 AI 캐릭터를 선택하고, 데이터 네트워크 속을 달리면서 바이러스를 피해 백신을 수집합니다.

게임이 진행될수록 데이터 전송속도가 빨라진다는 설정으로 게임 속도도 점점 빨라집니다.

최종 목표는 간단합니다.

바이러스에 감염되지 않고 최대한 오래 살아남아 최고 점수를 기록한다.

2. 시작 화면

게임을 실행하면 바로 달리기보다는 캐릭터 선택 화면부터 보여줍니다.

╔══════════════════════════════════════╗

              AI CYBER RUN

             백신을 찾아서

       사이버 세계를 바이러스로부터
                지켜주세요!

       🐥                    🐻
     노란 AI                흰 AI

     [ 선택 ]               [ 선택 ]

              ❤️❤️❤️❤️❤️

             [ GAME START ]

╚══════════════════════════════════════╝

여기서 첨부하신 캐릭터 이미지를 실제 게임 자산으로 사용하면 됩니다.

캐릭터 이름도 나중에 직접 정하면 재미있겠습니다.

3. 실제 게임 화면

제가 추천하는 화면은 3레인 방식입니다.

        SCORE  01250          ❤️ × 4

              CYBER WORLD

        LEFT     CENTER     RIGHT
          │         │         │
          │    🦠   │         │
          │         │    💉   │
          │         │         │
          │         │    🦠   │
          │         │         │
          │    🐥   │         │
          │         │         │
          └─────────┴─────────┘

       ←          ↑          →

캐릭터는 화면 아래쪽에 있고 배경과 장애물이 플레이어 방향으로 빠르게 다가옵니다.

실제로 캐릭터가 앞으로 수백 미터 이동하는 것처럼 보이지만 프로그램에서는 도로와 장애물을 아래쪽으로 이동시키는 방식으로 구현하면 초보자에게 훨씬 쉽습니다.

4. 조작 방법

조작은 처음에는 세 개면 충분합니다.

키	기능
←	왼쪽 레인 이동
→	오른쪽 레인 이동
↑ 또는 Space	점프

예를 들어 가운데에서 달리고 있는데 바이러스가 나타나면

← 왼쪽으로 피하기

또는

Space → 점프해서 뛰어넘기

두 가지 선택이 가능합니다.

이렇게 해야 단순 좌우 이동보다 게임성이 좋아집니다.

5. ❤️ 목숨 시스템

재연님 아이디어대로 최대 5개로 하겠습니다.

게임 시작:

❤️ ❤️ ❤️ ❤️ ❤️

바이러스와 충돌:

❤️ ❤️ ❤️ ❤️ 🖤

즉 목숨 -1

그리고 5개를 모두 잃으면:

SYSTEM INFECTED

GAME OVER

SCORE
12,850

BEST SCORE
23,400

[ 다시 시작 ]

[ 캐릭터 선택 ]

중요한 것이 하나 있습니다.

바이러스 하나와 접촉했는데 계속 겹쳐 있으면서 목숨 5개가 순식간에 없어지면 안 됩니다.

따라서 충돌 후 약 1.5초 무적시간을 주겠습니다.

그동안 캐릭터가 깜빡이도록 만들면 사용자가 바로 이해합니다.

6. 🦠 바이러스

장애물도 처음부터 여러 종류를 만들 필요 없습니다.

1단계 바이러스

🦠 일반 바이러스
→ 충돌하면 ❤️ -1

게임이 발전하면:

🦠 일반 바이러스
⚡ 빠른 바이러스
👾 움직이는 악성코드
🔥 랜섬웨어

처럼 종류를 늘릴 수 있습니다.

이름도 단순 장애물이 아니라 Trojan / Malware / Ransomware 같은 사이버 용어로 발전시킬 수 있고요.

7. 💉 백신 아이템

이 게임의 핵심 아이템입니다.

달리다 가끔 백신이 나타납니다.

획득하면:

❤️ +1

단, 재연님이 정하신 규칙대로 최대 5개 이상 올라가지 않습니다.

예를 들어 현재

❤️❤️❤️

이면 백신 획득 후

❤️❤️❤️❤️

하지만 이미

❤️❤️❤️❤️❤️

라면 백신을 먹어도 6개가 되지 않습니다.

대신 저는 여기서 작은 보상을 하나 추가하는 것을 추천합니다.

체력이 이미 5일 때 백신 획득 → +500점

그러면 체력이 가득 찼다고 백신을 피할 이유가 없어집니다.

8. ⭐ 점수 시스템

점수는 두 종류로 계산하면 좋습니다.

생존 점수: 달리는 동안 계속 증가
아이템 점수: 백신이나 데이터 아이템을 먹으면 추가 증가

예를 들어:

달리기           +10점 / 초

백신 획득        +100점

체력 MAX 상태
백신 획득        +500점

데이터 칩 획득   +200점

그래서 단순히 오래 버티는 것뿐 아니라 위험을 감수하고 아이템을 먹는 재미가 생깁니다.

9. 난이도 시스템

이것도 게임 재미에 상당히 중요합니다.

처음에는:

느린 속도 + 바이러스 적음

30초 정도 지나면:

속도 증가 + 바이러스 증가

60초:

더 빠름 + 두 레인 동시 장애물

90초 이상:

고속 + 장애물 연속 등장

이렇게 하면 별도의 스테이지를 만들지 않아도 자연스럽게 어려워집니다.

